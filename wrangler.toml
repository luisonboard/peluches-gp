# Worker de Peluches GP: el juego compilado (dist) y el relevo de salas en /relay, en la misma dirección.
name = "peluches-gp"
main = "relay/worker.mjs"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/relay", "/relay/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Rooms"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Rooms"]
